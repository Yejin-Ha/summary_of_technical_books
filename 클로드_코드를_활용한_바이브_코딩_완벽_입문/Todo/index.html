<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo 앱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>TODO</h1>
      <button class="theme-toggle" id="themeToggle" title="테마 변경">🌙</button>
    </header>

    <div class="input-wrapper">
      <input
        type="text"
        id="todoInput"
        placeholder="할 일을 입력하세요..."
        autocomplete="off"
        maxlength="200"
      />
      <button id="addBtn">추가</button>
    </div>

    <div class="card">
      <ul id="todoList"></ul>

      <div class="footer" id="footer">
        <span id="itemCount">0개 남음</span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="active">미완료</button>
          <button class="filter-btn" data-filter="completed">완료</button>
        </div>
        <button id="clearCompleted">완료 항목 삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
